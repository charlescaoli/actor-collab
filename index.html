<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actor Collab</title>
<style>
:root {
  --bg: #0a0a0f;
  --card-bg: rgba(20, 20, 35, 0.85);
  --text: #e8e8ec;
  --text-secondary: #9898a8;
  --accent: #f5c518;
  --accent-glow: rgba(245, 197, 24, 0.3);
  --border: rgba(255, 255, 255, 0.08);
  --radius: 12px;
  --max-width: 1100px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ambient */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(ellipse at 20% 20%, rgba(245,197,24,0.04) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 60%, rgba(180,60,200,0.05) 0%, transparent 60%),
              radial-gradient(ellipse at 40% 80%, rgba(30,100,220,0.06) 0%, transparent 50%);
  animation: ambient 15s ease-in-out infinite alternate;
}
@keyframes ambient { 0%{opacity:.6;transform:scale(1)} 100%{opacity:1;transform:scale(1.08)} }

body::after {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 25% 35%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 40% 10%, rgba(255,255,255,0.2), transparent),
    radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,0.35), transparent),
    radial-gradient(1px 1px at 70% 25%, rgba(255,255,255,0.25), transparent),
    radial-gradient(1px 1px at 85% 55%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1.5px 1.5px at 15% 70%, rgba(245,197,24,0.3), transparent),
    radial-gradient(1.5px 1.5px at 60% 80%, rgba(245,197,24,0.25), transparent);
  animation: particles 20s linear infinite;
}
@keyframes particles { 0%{transform:translateY(0) translateX(0);opacity:.6} 25%{transform:translateY(-10px) translateX(5px);opacity:1} 50%{transform:translateY(-5px) translateX(-3px);opacity:.7} 75%{transform:translateY(-15px) translateX(8px);opacity:.9} 100%{transform:translateY(0) translateX(0);opacity:.6} }

.container { max-width: var(--max-width); margin: 0 auto; padding: 16px 20px; position: relative; z-index: 1; }

/* Header */
.header { text-align: center; padding: 40px 20px 24px; }
.header h1 {
  font-size: 1.8rem; font-weight: 800; letter-spacing: -0.03em;
  background: linear-gradient(135deg, #f5c518, #e8a810, #ffd700, #f5c518); background-size: 200% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  animation: shimmer 3s ease-in-out infinite alternate;
}
@keyframes shimmer { 0%{background-position:0% center} 100%{background-position:200% center} }
.header p { color: var(--text-secondary); font-size: 0.85rem; margin-top: 2px; }

/* Search */
.search-wrapper { position: relative; max-width: 480px; margin: 0 auto 16px; }
.search-input {
  width: 100%; height: 46px; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
  padding: 0 44px 0 16px; font-size: 0.95rem; background: rgba(255,255,255,0.05);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: var(--text); outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.search-input:focus { border-color: var(--accent); box-shadow: 0 0 18px var(--accent-glow); background: rgba(255,255,255,0.08); }
.search-input::placeholder { color: #555; }
.search-spinner {
  position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.6s linear infinite; display: none;
}
.search-spinner.active { display: block; }
@keyframes spin { to { transform: translateY(-50%) rotate(360deg); } }

.suggestions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }
.suggestion-chip {
  padding: 6px 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px; font-size: 0.8rem; cursor: pointer; color: var(--text-secondary);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: all 0.2s;
}
.suggestion-chip:hover { border-color: var(--accent); color: var(--accent); background: rgba(245,197,24,0.08); box-shadow: 0 0 12px var(--accent-glow); }

/* Search Results */
.search-results {
  max-width: 480px; margin: 0 auto; background: var(--card-bg); backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; display: none;
}
.search-results.show { display: block; }
.search-result-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; transition: background 0.12s;
}
.search-result-item:hover, .search-result-item.active { background: rgba(255,255,255,0.05); }
.search-result-item img, .search-result-item .no-avatar {
  width: 40px; height: 60px; border-radius: 6px; object-fit: cover; background: rgba(255,255,255,0.04);
}
.no-avatar { display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: #5a5a6e; }
.search-result-item .info h3 { font-size: 0.88rem; font-weight: 600; }
.search-result-item .info span { font-size: 0.75rem; color: var(--text-secondary); }

/* Actor Banner */
.actor-banner {
  display: none; gap: 20px; padding: 20px 24px; background: var(--card-bg); backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px); border-radius: var(--radius); border: 1px solid var(--border);
  margin-bottom: 20px; align-items: flex-start;
}
.actor-banner.show { display: flex; }
.actor-banner .avatar { width: 100px; height: 150px; border-radius: 10px; object-fit: cover; background: rgba(255,255,255,0.04); flex-shrink: 0; }
.actor-banner .info { flex: 1; min-width: 0; }
.actor-banner .info h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.actor-banner .info .bio { color: var(--text-secondary); margin-top: 3px; font-size: 0.8rem; }
.actor-banner .info .actor-bio {
  color: #b0b0bc; font-size: 0.78rem; line-height: 1.55; margin-top: 6px;
  max-height: 72px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
}
.actor-banner .top-movies { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.top-movie-item { text-align: center; width: 62px; }
.top-movie-item img {
  width: 62px; height: 93px; border-radius: 6px; object-fit: cover; background: rgba(255,255,255,0.04);
  cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
}
.top-movie-item img:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
.top-movie-item .t-label { font-size: 0.65rem; color: var(--text-secondary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62px; }
.top-movie-item .t-revenue { font-size: 0.62rem; color: var(--accent); font-weight: 600; }

.banner-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
.back-btn, .graph-btn {
  padding: 7px 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 8px; font-size: 0.8rem; cursor: pointer; color: var(--text-secondary);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: all 0.2s; white-space: nowrap;
}
.back-btn:hover, .graph-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
.graph-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(245,197,24,0.08); }

@media (max-width: 600px) {
  .actor-banner { flex-direction: column; align-items: center; text-align: center; }
  .banner-actions { flex-direction: row; }
  .actor-banner .top-movies { justify-content: center; }
}

/* Loading */
.loading-section { text-align: center; padding: 32px; display: none; }
.loading-section.show { display: block; }
.loading-text { font-size: 0.85rem; color: var(--text-secondary); }
.progress-bar { max-width: 320px; height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; margin: 12px auto 0; overflow: hidden; }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #ffd700); border-radius: 2px; transition: width 0.3s; width: 0%; }

/* Graph */
.graph-container {
  display: none; margin-bottom: 20px; border-radius: var(--radius); border: 1px solid var(--border);
  overflow: hidden; position: relative; background: radial-gradient(ellipse at center, #14141e 0%, #0a0a0f 100%);
  height: 460px; cursor: grab; user-select: none; -webkit-user-select: none;
}
.graph-container.show { display: block; }
.graph-container:active { cursor: grabbing; }
.graph-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.graph-svg line { pointer-events: none; }
.graph-nodes { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.graph-nodes * { pointer-events: auto; }
.graph-hint { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 0.7rem; color: rgba(255,255,255,0.15); pointer-events: none; z-index: 3; }

/* Graph node elements */
.gnode {
  position: absolute; transform: translate(-50%, -50%); cursor: pointer;
  border-radius: 50%; transition: none;
}
.gnode-center {
  width: 22px; height: 22px; background: #f5c518; box-shadow: 0 0 18px rgba(245,197,24,0.6), 0 0 40px rgba(245,197,24,0.25);
  border: 2px solid rgba(255,255,255,0.7);
}
.gnode-actor {
  width: 12px; height: 12px; background: rgba(210,215,235,0.85);
  box-shadow: 0 0 6px rgba(210,215,235,0.3);
}
.gnode-actor-strong {
  width: 16px; height: 16px; background: #f0d060;
  box-shadow: 0 0 12px rgba(245,197,24,0.4);
}
.gnode-film {
  width: 4px; height: 4px; background: rgba(130,160,220,0.35); border-radius: 50%;
}
.gnode-highlight {
  width: 18px !important; height: 18px !important; background: #f5c518 !important;
  box-shadow: 0 0 20px rgba(245,197,24,0.7), 0 0 40px rgba(245,197,24,0.3) !important;
  z-index: 10 !important;
}
.gnode-faded { opacity: 0.15; }

.gnode-label {
  position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap;
  font-size: 8px; color: #aaa; margin-top: 12px; display: none; pointer-events: none;
}
.gnode-highlight .gnode-label,
.gnode-center .gnode-label { display: block; }
.gnode-center .gnode-label { color: #fff; font-size: 10px; font-weight: 600; margin-top: 14px; }
.gnode-highlight .gnode-label { color: #f5c518; font-size: 9px; }

.gnode-count {
  position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap;
  font-size: 7px; color: #888; margin-top: 22px; display: none; pointer-events: none;
}
.gnode-highlight .gnode-count { display: block; }

@media (max-width: 600px) { .graph-container { height: 380px; } }

/* Collaboration Grid */
.collab-section { display: none; }
.collab-section.show { display: block; }
.collab-section h3 { font-size: 0.95rem; font-weight: 600; margin-bottom: 14px; color: var(--text-secondary); }
.collab-section h3 strong { color: var(--text); }
.collab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 12px; }
@media (max-width: 600px) { .collab-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; } }

.collab-card {
  background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 10px; border: 1px solid var(--border); overflow: hidden; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
}
.collab-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 20px var(--accent-glow); border-color: rgba(245,197,24,0.2); }
.collab-card .avatar { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: rgba(255,255,255,0.02); }
.collab-card .no-avatar-card { width: 100%; aspect-ratio: 2/3; background: rgba(255,255,255,0.02); display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #3a3a4e; }
.collab-card .meta { padding: 10px 12px 6px; }
.collab-card .meta h4 { font-size: 0.84rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.collab-card .meta .count { font-size: 0.72rem; color: var(--accent); font-weight: 600; margin-top: 1px; }
.collab-card .shared-movies { padding: 0 12px 10px; display: flex; flex-direction: column; gap: 3px; }
.shared-movie-line { display: flex; align-items: center; gap: 5px; font-size: 0.68rem; color: #888; }
.shared-movie-line .sm-year { color: #555; font-size: 0.64rem; }
.shared-movie-line .sm-revenue { color: var(--accent); font-size: 0.64rem; margin-left: auto; }
.shared-movie-line img { width: 24px; height: 36px; border-radius: 2px; object-fit: cover; cursor: pointer; flex-shrink: 0; }

/* Error */
.error-toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #e63946; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 0.82rem; font-weight: 500; box-shadow: 0 4px 16px rgba(230,57,70,0.35); z-index: 1000; display: none; }
.error-toast.show { display: block; }

/* API Key */
.api-key-prompt { text-align: center; padding: 32px 16px; display: none; }
.api-key-prompt.show { display: block; }
.api-key-prompt h2 { font-size: 1.3rem; margin-bottom: 10px; }
.api-key-prompt p { color: var(--text-secondary); margin-bottom: 14px; max-width: 440px; margin-left: auto; margin-right: auto; font-size: 0.85rem; }
.api-key-prompt a { color: var(--accent); text-decoration: none; }
.api-key-input { display: flex; gap: 8px; max-width: 380px; margin: 0 auto; }
.api-key-input input { flex: 1; height: 40px; border: 1px solid var(--border); border-radius: 8px; padding: 0 12px; font-size: 0.85rem; outline: none; background: rgba(255,255,255,0.05); color: var(--text); }
.api-key-input input:focus { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
.btn { height: 40px; padding: 0 18px; background: linear-gradient(135deg, #f5c518, #e8a810); color: #0a0a0f; border: none; border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s, box-shadow 0.2s; }
.btn:hover { opacity: 0.9; box-shadow: 0 0 16px var(--accent-glow); }
.btn:active { transform: scale(0.98); }

/* ── IMDB Movie Modal ────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.92);
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.modal-overlay.show { display: flex; }
.modal-card {
  background: #1a1a1a; width: 100%; max-width: 720px; max-height: 90vh;
  overflow-y: auto; border-radius: 6px; animation: slideUp 0.2s ease;
}
@keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.modal-hero {
  height: 180px; position: relative; background-size: cover; background-position: center 15%; background-color: #141414;
}
.modal-hero::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 80px; background: linear-gradient(transparent, #1a1a1a); }
.modal-close {
  position: absolute; top: 12px; right: 12px; z-index: 10;
  width: 30px; height: 30px; border-radius: 50%; border: none;
  background: rgba(0,0,0,0.55); color: #fff; font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

.modal-body-wrap { padding: 0 24px 24px; margin-top: -60px; position: relative; z-index: 3; }

.modal-top { display: flex; gap: 24px; margin-bottom: 18px; align-items: flex-end; }
.modal-poster-landscape { width: 260px; height: 146px; flex-shrink: 0; border-radius: 4px; object-fit: cover; background: #2a2a2a; box-shadow: 0 4px 16px rgba(0,0,0,0.6); }
.modal-title-info { padding-bottom: 0; }
.modal-title-info h2 { font-size: 1.5rem; font-weight: 700; color: #fff; line-height: 1.15; }
.modal-orig-title { font-size: 0.78rem; color: #888; margin-top: 1px; }
.modal-meta-bar { margin-top: 8px; display: flex; gap: 10px; align-items: center; font-size: 0.8rem; color: #bbb; }
.modal-meta-bar .star { color: #f5c518; }
.modal-meta-bar strong { color: #fff; font-size: 0.95rem; }

.modal-stats-strip {
  display: flex; gap: 22px; padding: 10px 0; flex-wrap: wrap;
  border-top: 1px solid #2a2a2a; border-bottom: 1px solid #2a2a2a; margin-bottom: 14px;
}
.modal-stats-strip .stat { display: flex; flex-direction: column; gap: 1px; }
.modal-stats-strip .stat .lbl { font-size: 0.68rem; color: #777; text-transform: uppercase; letter-spacing: 0.04em; }
.modal-stats-strip .stat .val { font-size: 0.84rem; color: #ddd; font-weight: 600; }
.modal-stats-strip .stat .val.gold { color: #f5c518; }

.modal-genre-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 14px; }
.modal-genre-row span { padding: 2px 8px; background: #2a2a2a; border-radius: 2px; font-size: 0.72rem; color: #bbb; }

.modal-section { margin-bottom: 14px; }
.modal-section-title { font-size: 0.82rem; font-weight: 700; color: #f5c518; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #2a2a2a; }
.modal-overview-text { font-size: 0.8rem; color: #aaa; line-height: 1.6; }

.modal-cast-scroll { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.modal-cast-scroll::-webkit-scrollbar { height: 3px; }
.modal-cast-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
.modal-cast-item { flex-shrink: 0; width: 72px; cursor: pointer; text-align: center; }
.modal-cast-item .cast-img { width: 72px; height: 108px; border-radius: 3px; background: #2a2a2a; object-fit: cover; }
.modal-cast-item .cast-no-img { width: 72px; height: 108px; border-radius: 3px; background: #2a2a2a; display: flex; align-items: center; justify-content: center; color: #555; font-size: 1.3rem; }
.modal-cast-item .cast-name { font-size: 0.72rem; font-weight: 500; color: #ddd; line-height: 1.2; margin-top: 4px; }
.modal-cast-item .cast-char { font-size: 0.66rem; color: #888; line-height: 1.2; }

@media (max-width: 600px) {
  .modal-hero { height: 120px; }
  .modal-top { flex-direction: column; align-items: center; }
  .modal-poster-landscape { width: 100%; max-width: 300px; height: auto; aspect-ratio: 16/9; }
  .modal-title-info { text-align: center; }
  .modal-title-info h2 { font-size: 1.2rem; }
  .modal-meta-bar { justify-content: center; flex-wrap: wrap; }
  .modal-stats-strip { justify-content: center; gap: 14px; }
  .modal-body-wrap { padding: 0 14px 16px; }
}

</style>
</head>
<body>
<div class="container"><header class="header"><h1>Actor Collab</h1><p>探索演员之间的合作关系</p></header><div class="api-key-prompt show" id="apiKeyPrompt"><h2>需要 TMDB API Key</h2><p>本应用使用 <a href="https://www.themoviedb.org/settings/api" target="_blank">TMDB API</a></p><div class="api-key-input"><input type="text" id="apiKeyInput" placeholder="粘贴你的 TMDB API Key..."><button class="btn" id="saveApiKey">保存</button></div></div><div class="search-wrapper" id="searchWrapper" style="display:none"><input type="text" class="search-input" id="searchInput" placeholder="输入演员名字... 例如：梁朝伟、Tom Hanks" autocomplete="off"><div class="search-spinner" id="searchSpinner"></div></div><div class="suggestions" id="suggestions" style="display:none"><button class="suggestion-chip" data-name="梁朝伟">梁朝伟</button><button class="suggestion-chip" data-name="Tom Hanks">Tom Hanks</button><button class="suggestion-chip" data-name="张国荣">张国荣</button><button class="suggestion-chip" data-name="Scarlett Johansson">Scarlett Johansson</button><button class="suggestion-chip" data-name="刘德华">刘德华</button><button class="suggestion-chip" data-name="Brad Pitt">Brad Pitt</button></div><div id="landingState" style="text-align:center;padding:40px 20px;display:none"><p>搜索演员，发现他们的合作圈子</p></div><div class="search-results" id="searchResults"></div><div class="actor-banner" id="actorBanner"><img class="avatar" id="bannerAvatar" src="" alt=""><div class="info"><h2 id="bannerName"></h2><p class="bio" id="bannerDetails"></p><p class="actor-bio" id="bannerBio"></p><div class="top-movies" id="bannerTopMovies"></div></div><div class="banner-actions"><button class="back-btn" id="backBtn">← 返回</button><button class="graph-btn" id="graphToggleBtn">🔗 关系图</button></div></div><div class="loading-section" id="loadingSection"><p class="loading-text" id="loadingText">正在加载作品列表...</p><div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div></div><div class="graph-gallery" id="graphContainer"><div class="graph-gallery-scroll" id="graphGalleryScroll"></div></div><div class="collab-section" id="collabSection"><h3 id="collabTitle"></h3><div class="collab-grid" id="collabGrid"></div></div><div class="error-toast" id="errorToast"></div><div class="modal-overlay" id="movieModal"><div class="modal-card"><div class="modal-hero" id="modalHero"><button class="modal-close" id="modalClose">&times;</button></div><div class="modal-body-wrap"><div class="modal-top"><img class="modal-poster-landscape" id="modalPoster" src="" alt=""><div class="modal-title-info"><h2 id="modalTitle"></h2><p class="modal-orig-title" id="modalOrigTitle"></p><div class="modal-meta-bar" id="modalMetaBar"></div></div></div><div class="modal-stats-strip" id="modalStats"></div><div class="modal-genre-row" id="modalGenres"></div><div class="modal-section"><div class="modal-section-title">剧情简介</div><p class="modal-overview-text" id="modalOverview"></p></div><div class="modal-section"><div class="modal-section-title" id="modalCastTitle">演员表</div><div class="modal-cast-scroll" id="modalCast"></div></div></div></div></div></div>
<script>
var TMDB_API_KEY = "48aadff7dc3b51412e03de79d1630688";
const TMDB_BASE = 'https://api.themoviedb.org/3';
const IMG_BASE = 'https://image.tmdb.org/t/p';

let API_KEY = '48aadff7dc3b51412e03de79d1630688';

function setApiKey(key) {
  API_KEY = key;
}

function getApiKey() {
  return API_KEY;
}

async function fetchTMDB(path, params = {}) {
  if (!API_KEY) {
    throw new Error('API_KEY_NOT_SET');
  }
  const url = new URL(`${TMDB_BASE}${path}`);
  url.searchParams.set('api_key', API_KEY);
  url.searchParams.set('language', 'zh-CN');
  for (const [k, v] of Object.entries(params)) {
    url.searchParams.set(k, v);
  }
  const res = await fetch(url);
  if (!res.ok) {
    if (res.status === 401) throw new Error('INVALID_API_KEY');
    if (res.status === 429) throw new Error('RATE_LIMITED');
    throw new Error(`API error: ${res.status}`);
  }
  return res.json();
}

async function searchPerson(query) {
  const data = await fetchTMDB('/search/person', { query });
  return data.results || [];
}

async function getPersonDetails(id) {
  return fetchTMDB(`/person/${id}`);
}

async function getPersonMovieCredits(id) {
  const data = await fetchTMDB(`/person/${id}/movie_credits`);
  return data.cast || [];
}

async function getPersonTVCredits(id) {
  const data = await fetchTMDB(`/person/${id}/tv_credits`);
  return data.cast || [];
}

async function getMovieCredits(movieId) {
  const data = await fetchTMDB(`/movie/${movieId}/credits`);
  return data.cast || [];
}

async function getTVCredits(tvId) {
  const data = await fetchTMDB(`/tv/${tvId}/credits`);
  return data.cast || [];
}

function profileUrl(path, size = 'w185') {
  if (!path) return '';
  return `${IMG_BASE}/${size}${path}`;
}

function posterUrl(path, size = 'w92') {
  if (!path) return '';
  return `${IMG_BASE}/${size}${path}`;
}

function backdropUrl(path, size = 'w780') {
  if (!path) return '';
  return `${IMG_BASE}/${size}${path}`;
}

async function getMovieDetails(movieId) {
  return fetchTMDB(`/movie/${movieId}`);
}

async function getTVDetails(tvId) {
  return fetchTMDB(`/tv/${tvId}`);
}


// ── DOM refs ──────────────────────────────────
const apiKeyPrompt  = document.getElementById('apiKeyPrompt');
const apiKeyInput   = document.getElementById('apiKeyInput');
const saveApiKeyBtn = document.getElementById('saveApiKey');
const searchWrapper = document.getElementById('searchWrapper');
const searchInput   = document.getElementById('searchInput');
const searchSpinner = document.getElementById('searchSpinner');
const searchResults = document.getElementById('searchResults');
const suggestions   = document.getElementById('suggestions');
const landingState  = document.getElementById('landingState');
const actorBanner   = document.getElementById('actorBanner');
const bannerAvatar  = document.getElementById('bannerAvatar');
const bannerName    = document.getElementById('bannerName');
const bannerDetails = document.getElementById('bannerDetails');
const bannerTopMovies = document.getElementById('bannerTopMovies');
const bannerBio     = document.getElementById('bannerBio');
const backBtn       = document.getElementById('backBtn');
const graphToggleBtn = document.getElementById('graphToggleBtn');
const graphContainer = document.getElementById('graphContainer');
const graphGalleryScroll = document.getElementById('graphGalleryScroll');
const loadingSection = document.getElementById('loadingSection');
const loadingText   = document.getElementById('loadingText');
const progressFill  = document.getElementById('progressFill');
const collabSection = document.getElementById('collabSection');
const collabTitle   = document.getElementById('collabTitle');
const collabGrid    = document.getElementById('collabGrid');
const errorToast    = document.getElementById('errorToast');
const movieModal    = document.getElementById('movieModal');
const modalClose    = document.getElementById('modalClose');
const modalBackdrop = document.getElementById('modalBackdrop');
const modalPoster   = document.getElementById('modalPoster');
const modalTitle    = document.getElementById('modalTitle');
const modalMeta     = document.getElementById('modalMeta');
const modalOverview = document.getElementById('modalOverview');
const modalCast     = document.getElementById('modalCast');

// ── State ─────────────────────────────────────
let searchTimer = null;
let currentActor = null;

// ── Cache ─────────────────────────────────────
const creditsCache = new Map();    // key: "movie-123" or "tv-456" → cast[]
const collabCache = new Map();     // key: actorId → collab results

// ── API Key ───────────────────────────────────
if (getApiKey()) {
  showApp();
}

saveApiKeyBtn.addEventListener('click', () => {
  const key = apiKeyInput.value.trim();
  if (!key) return;
  setApiKey(key);
  localStorage.setItem('tmdb_api_key', key);
  showApp();
});

apiKeyInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') saveApiKeyBtn.click();
});

function showApp() {
  apiKeyPrompt.classList.remove('show');
  searchWrapper.style.display = '';
  suggestions.style.display = '';
  landingState.style.display = '';
}

// ── Toast ─────────────────────────────────────
let toastTimer;
function showToast(msg) {
  clearTimeout(toastTimer);
  errorToast.textContent = msg;
  errorToast.classList.add('show');
  toastTimer = setTimeout(() => errorToast.classList.remove('show'), 3000);
}

// ── Search ────────────────────────────────────
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const query = searchInput.value.trim();

  if (!query) {
    searchResults.classList.remove('show');
    searchSpinner.classList.remove('active');
    return;
  }

  // Hide previous results while searching
  actorBanner.classList.remove('show');
  collabSection.classList.remove('show');
  graphContainer.classList.remove('show');
  loadingSection.classList.remove('show');
  graphToggleBtn.classList.remove('active');
  graphToggleBtn.textContent = '🔗 关系图';
  landingState.style.display = 'none';

  searchSpinner.classList.add('active');
  searchTimer = setTimeout(() => doSearch(query), 300);
});

function doSearch(query) {
  searchPerson(query)
    .then(results => {
      searchSpinner.classList.remove('active');
      renderSearchResults(results);
    })
    .catch(err => {
      searchSpinner.classList.remove('active');
      if (err.message === 'INVALID_API_KEY') {
        showToast('API Key 无效，请重新输入');
        resetApiKey();
      } else if (err.message === 'RATE_LIMITED') {
        showToast('请求太频繁，请稍等再试');
      } else {
        showToast('搜索失败，请检查网络连接');
      }
    });
}

function renderSearchResults(results) {
  searchResults.innerHTML = '';

  if (!results.length) {
    searchResults.innerHTML = '<div style="padding:16px;text-align:center;color:var(--text-secondary)">未找到匹配的演员</div>';
    searchResults.classList.add('show');
    return;
  }

  const sliced = results.slice(0, 8);
  sliced.forEach(person => {
    const div = document.createElement('div');
    div.className = 'search-result-item';
    const knownFor = (person.known_for || []).slice(0, 3).map(m => m.title || m.name).join(', ');
    div.innerHTML = `
      ${person.profile_path
        ? `<img src="${profileUrl(person.profile_path)}" alt="" loading="lazy">`
        : `<div class="no-avatar">🎬</div>`
      }
      <div class="info">
        <h3>${esc(person.name)}</h3>
        <span>${person.known_for_department || ''}${knownFor ? ' · ' + knownFor : ''}</span>
      </div>
    `;
    div.addEventListener('click', () => selectActor(person));
    searchResults.appendChild(div);
  });

  searchResults.classList.add('show');
}

// ── Quick suggestions ─────────────────────────
suggestions.addEventListener('click', (e) => {
  const chip = e.target.closest('.suggestion-chip');
  if (!chip) return;
  const name = chip.dataset.name;
  searchInput.value = name;
  searchResults.classList.remove('show');
  landingState.style.display = 'none';
  doSearch(name);
});

// ── Actor Selection ───────────────────────────
async function selectActor(person) {
  currentActor = person;
  searchResults.classList.remove('show');
  searchInput.value = '';

  // Show banner immediately with what we have
  bannerAvatar.src = profileUrl(person.profile_path);
  bannerAvatar.alt = person.name;
  bannerName.textContent = person.name;
  bannerDetails.textContent = person.known_for_department || '';
  bannerTopMovies.innerHTML = '';
  actorBanner.classList.add('show');
  landingState.style.display = 'none';

  // Show loading
  collabSection.classList.remove('show');
  loadingSection.classList.add('show');
  loadingText.textContent = '正在加载作品列表...';
  progressFill.style.width = '0%';

  try {
    const [details, movieCredits, tvCredits] = await Promise.all([
      getPersonDetails(person.id),
      getPersonMovieCredits(person.id),
      getPersonTVCredits(person.id)
    ]);

    // Update banner with details + top 5 movies
    bannerDetails.textContent = [
      details.birthday ? `🎂 ${details.birthday}` : '',
      details.place_of_birth ? `📍 ${details.place_of_birth}` : '',
    ].filter(Boolean).join('  ·  ') || person.known_for_department || '';
    bannerBio.textContent = details.biography
      ? details.biography.slice(0, 150).replace(/\n/g, ' ') + (details.biography.length > 150 ? '…' : '')
      : '';

    const allCredits = [
      ...movieCredits.map(m => ({ id: m.id, type: 'movie', title: m.title || m.original_title, date: m.release_date || '', popularity: m.popularity, poster_path: m.poster_path })),
      ...tvCredits.map(t => ({ id: t.id, type: 'tv', title: t.name || t.original_name, date: t.first_air_date || '', popularity: t.popularity, poster_path: t.poster_path }))
    ];

    const seenWorks = new Set();
    const uniqueCredits = [];
    for (const w of allCredits) {
      const k = `${w.type}-${w.id}`;
      if (seenWorks.has(k)) continue;
      seenWorks.add(k);
      uniqueCredits.push(w);
    }

    // Banner top 5: sort by box office revenue (fetch details for top popular movies)
    const moviesOnly = uniqueCredits.filter(w => w.type === 'movie');
    const topPopular = [...moviesOnly].sort((a, b) => b.popularity - a.popularity).slice(0, 15);
    const movieDetails = await Promise.allSettled(
      topPopular.map(w => getMovieDetails(w.id))
    );
    const withRevenue = topPopular
      .map((w, i) => ({ ...w, revenue: movieDetails[i].status === 'fulfilled' ? (movieDetails[i].value.revenue || 0) : 0 }))
      .sort((a, b) => b.revenue - a.revenue);
    const top5 = withRevenue.slice(0, 5);

    bannerTopMovies.innerHTML = top5.map(w => `
      <div class="top-movie-item">
        ${w.poster_path
          ? `<img src="${posterUrl(w.poster_path, 'w92')}" alt="${esc(w.title)}" loading="lazy" data-movie-type="${w.type}" data-movie-id="${w.id}">`
          : `<div style="width:62px;height:93px;background:rgba(255,255,255,0.04);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:0.6rem;color:#5a5a6e;cursor:pointer" data-movie-type="${w.type}" data-movie-id="${w.id}">${esc(w.title)}</div>`
        }
        <div class="t-label">${esc(w.title)}</div>
        <div class="t-revenue">${w.revenue ? '$' + fmtMoney(w.revenue) : ''} · ${w.date.slice(0,4) || '—'}</div>
      </div>`).join('');

    // Compute collaborations: sort by date DESC (newest first) to cover full career
    let collabs;
    if (collabCache.has(person.id)) {
      collabs = collabCache.get(person.id);
      loadingSection.classList.remove('show');
    } else {
      const creditsByDate = [...uniqueCredits].sort((a, b) => b.date.localeCompare(a.date));
      collabs = await computeCollaborations(person.id, creditsByDate);
      collabCache.set(person.id, collabs);
    }
    currentCollabs = collabs;
    renderCollaborations(collabs, person.name);

  } catch (err) {
    loadingSection.classList.remove('show');
    if (err.message === 'INVALID_API_KEY') {
      showToast('API Key 无效，请重新输入');
      resetApiKey();
    } else {
      showToast('加载失败: ' + err.message);
    }
  }
}

// ── Collaboration Computation ─────────────────
async function computeCollaborations(actorId, sortedWorks) {
  // sortedWorks is pre-sorted by date DESC, already deduplicated
  // Uniform sampling across the career to cover ALL eras (not just recent)
  const MAX = 50;
  let sampledWorks;
  if (sortedWorks.length <= MAX) {
    sampledWorks = sortedWorks;
  } else {
    const step = sortedWorks.length / MAX;
    sampledWorks = [];
    for (let i = 0; i < MAX; i++) {
      sampledWorks.push(sortedWorks[Math.floor(i * step)]);
    }
  }
  const total = sampledWorks.length;

  const collabMap = new Map();

  loadingText.textContent = `正在分析 ${total} 部作品中的合作演员...`;

  const BATCH = 8;
  for (let i = 0; i < sampledWorks.length; i += BATCH) {
    const batch = sampledWorks.slice(i, i + BATCH);
    const results = await Promise.allSettled(
      batch.map(w => {
        const cacheKey = `${w.type}-${w.id}`;
        if (creditsCache.has(cacheKey)) {
          return Promise.resolve(creditsCache.get(cacheKey));
        }
        return (w.type === 'movie' ? getMovieCredits(w.id) : getTVCredits(w.id))
          .then(cast => { creditsCache.set(cacheKey, cast); return cast; });
      })
    );

    results.forEach((r, j) => {
      if (r.status !== 'fulfilled') return;
      const work = batch[j];
      for (const castMember of r.value) {
        if (castMember.id === actorId) continue;
        const name = castMember.name;
        if (!collabMap.has(name)) {
          collabMap.set(name, {
            id: castMember.id,
            name,
            profile_path: castMember.profile_path,
            count: 0,
            sharedWorks: new Map()
          });
        }
        const entry = collabMap.get(name);
        entry.count++;
        const swKey = `${work.type}-${work.id}`;
        if (!entry.sharedWorks.has(swKey)) {
          entry.sharedWorks.set(swKey, work);
        }
      }
    });

    const done = Math.min(i + BATCH, total);
    progressFill.style.width = `${(done / total) * 100}%`;
    loadingText.textContent = `正在分析 ${done}/${total} 部作品...`;
  }

  // Sort by count desc, take top 50, convert sharedWorks to sorted array (top 5)
  return [...collabMap.values()]
    .sort((a, b) => b.count - a.count)
    .slice(0, 50)
    .map(c => ({
      ...c,
      sharedWorks: [...c.sharedWorks.values()]
        .sort((a, b) => b.popularity - a.popularity)
        .slice(0, 5)
    }));
}

// ── Render Collaborations ─────────────────────
function renderCollaborations(collabs, actorName) {
  loadingSection.classList.remove('show');
  collabGrid.innerHTML = '';

  if (!collabs.length) {
    collabGrid.innerHTML = '<p style="text-align:center;color:var(--text-secondary);grid-column:1/-1;padding:40px">未找到合作演员数据</p>';
    collabSection.classList.add('show');
    return;
  }

  collabTitle.innerHTML = `与 <strong>「${esc(actorName)}」</strong> 合作过的演员 · ${collabs.length} 人`;

  collabs.forEach(c => {
    const card = document.createElement('div');
    card.className = 'collab-card';

    const sharedHTML = c.sharedWorks.map(w => {
      if (w.poster_path) {
        return `<img class="shared-movie-thumb" src="${posterUrl(w.poster_path, 'w92')}" alt="${esc(w.title)}" title="${esc(w.title)}" loading="lazy" data-movie-type="${w.type}" data-movie-id="${w.id}">`;
      }
      return `<div class="shared-movie-thumb-placeholder" title="${esc(w.title)}" data-movie-type="${w.type}" data-movie-id="${w.id}" style="cursor:pointer">${esc(w.title.slice(0, 4))}</div>`;
    }).join('');

    card.innerHTML = `
      ${c.profile_path
        ? `<img class="avatar" src="${profileUrl(c.profile_path, 'w185')}" alt="${esc(c.name)}" loading="lazy">`
        : `<div class="no-avatar-card">🎬</div>`
      }
      <div class="meta">
        <h4>${esc(c.name)}</h4>
        <span class="count">合作 ${c.count} 次</span>
      </div>
      <div class="shared-movies">${sharedHTML}</div>
    `;

    card.addEventListener('click', () => {
      selectActor({ id: c.id, name: c.name, profile_path: c.profile_path, known_for_department: '' });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    collabGrid.appendChild(card);
  });

  collabSection.classList.add('show');
}

// ── Back button ───────────────────────────────
backBtn.addEventListener('click', () => {
  currentActor = null; currentCollabs = null;
  actorBanner.classList.remove('show');
  collabSection.classList.remove('show');
  graphContainer.classList.remove('show');
  loadingSection.classList.remove('show');
  graphToggleBtn.classList.remove('active');
  graphToggleBtn.textContent = '🔗 关系图';
  searchInput.value = '';
  landingState.style.display = '';
  searchInput.focus();
});

// ── Click outside search results ──────────────
document.addEventListener('click', (e) => {
  if (!searchResults.contains(e.target) && e.target !== searchInput) {
    searchResults.classList.remove('show');
  }

  // Movie poster click → open detail modal
  const movieThumb = e.target.closest('[data-movie-type]');
  if (movieThumb) {
    const type = movieThumb.dataset.movieType;
    const id = parseInt(movieThumb.dataset.movieId);
    if (type && id) openMovieDetail(type, id);
  }
});

// ── Movie Detail Modal ────────────────────────
modalClose.addEventListener('click', closeModal);
movieModal.addEventListener('click', (e) => {
  if (e.target === movieModal) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

function closeModal() {
  movieModal.classList.remove('show');
  document.body.style.overflow = '';
}

async function openMovieDetail(type, id) {
  movieModal.classList.add('show');
  document.body.style.overflow = 'hidden';

  // Show loading
  modalBackdrop.style.backgroundImage = '';
  modalPoster.src = '';
  modalTitle.textContent = '加载中...';
  modalMeta.innerHTML = '';
  modalOverview.textContent = '';
  modalCast.innerHTML = '<div class="modal-loading">正在加载...</div>';

  try {
    const [details, credits] = await Promise.all([
      type === 'movie' ? getMovieDetails(id) : getTVDetails(id),
      (async () => {
        const cacheKey = `${type}-${id}`;
        if (creditsCache.has(cacheKey)) return creditsCache.get(cacheKey);
        const cast = type === 'movie' ? await getMovieCredits(id) : await getTVCredits(id);
        creditsCache.set(cacheKey, cast);
        return cast;
      })()
    ]);

    // Backdrop
    if (details.backdrop_path) {
      modalBackdrop.style.backgroundImage = `url(${backdropUrl(details.backdrop_path)})`;
    }

    // Poster
    modalPoster.src = posterUrl(details.poster_path, 'w342');

    // Title
    modalTitle.textContent = details.title || details.name || '';

    // Meta
    const year = (details.release_date || details.first_air_date || '').slice(0, 4);
    const runtime = details.runtime ? `${details.runtime}分钟` : '';
    const genres = (details.genres || []).map(g => g.name).join(' / ');
    const rating = details.vote_average ? `★ ${details.vote_average.toFixed(1)}` : '';
    modalMeta.innerHTML = [year, runtime, genres, rating].filter(Boolean).map(s => `<span>${s}</span>`).join('');

    // Overview
    modalOverview.textContent = details.overview || '暂无简介';

    // Cast
    const topCast = (credits || []).slice(0, 30);
    modalCast.innerHTML = topCast.map(c => `
      <div class="modal-cast-chip" data-person-id="${c.id}" data-person-name="${esc(c.name)}" data-person-profile="${c.profile_path || ''}">
        ${c.profile_path
          ? `<img src="${profileUrl(c.profile_path)}" alt="${esc(c.name)}" loading="lazy">`
          : `<div class="no-avatar-small">🎬</div>`
        }
        <span class="cast-name">${esc(c.name)}</span>
        ${c.character ? `<span class="cast-role">${esc(c.character)}</span>` : ''}
      </div>
    `).join('');

    // Click actors in modal
    modalCast.querySelectorAll('.modal-cast-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const pid = parseInt(chip.dataset.personId);
        const pname = chip.dataset.personName;
        const pprofile = chip.dataset.personProfile;
        closeModal();
        selectActor({ id: pid, name: pname, profile_path: pprofile, known_for_department: '' });
      });
    });

  } catch (err) {
    modalCast.innerHTML = '<div class="modal-loading">加载失败</div>';
    showToast('加载电影详情失败');
  }
}

// ── Utils ─────────────────────────────────────
function esc(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function resetApiKey() {
  localStorage.removeItem('tmdb_api_key');
  setApiKey('');
  apiKeyPrompt.classList.add('show');
  searchWrapper.style.display = 'none';
  suggestions.style.display = 'none';
  landingState.style.display = 'none';
  actorBanner.classList.remove('show');
  collabSection.classList.remove('show');
  graphContainer.classList.remove('show');
  loadingSection.classList.remove('show');
  graphToggleBtn.classList.remove('active');
  graphToggleBtn.textContent = '🔗 关系图';
}

// ── Graph Toggle ──────────────────────────────
graphToggleBtn.addEventListener('click', () => {
  const isGraph = graphContainer.classList.contains('show');
  if (isGraph) {
    graphContainer.classList.remove('show');
    collabSection.classList.add('show');
    graphToggleBtn.textContent = '🔗 关系图';
    graphToggleBtn.classList.remove('active');
  } else {
    collabSection.classList.remove('show');
    graphContainer.classList.add('show');
    graphToggleBtn.textContent = '📋 列表';
    graphToggleBtn.classList.add('active');
    renderGraphGallery();
  }
});

// ── Graph Gallery (horizontal scroll) ──────────
function renderGraphGallery() {
  if (!currentCollabs || !currentCollabs.length) return;
  const name = bannerName.textContent;
  const top30 = currentCollabs.slice(0, 30);
  graphGalleryScroll.innerHTML = top30.map(c => `
    <div class="graph-gallery-card" data-actor-id="${c.id}" data-actor-name="${esc(c.name)}" data-actor-profile="${c.profile_path || ''}">
      ${c.profile_path
        ? `<img class="gg-avatar" src="${profileUrl(c.profile_path, 'w185')}" alt="${esc(c.name)}" loading="lazy">`
        : `<div class="gg-no-avatar">🎬</div>`
      }
      <div class="gg-name">${esc(c.name)}</div>
      <div class="gg-count" style="color:${c.count >= 8 ? '#f5c518' : '#888'}">合作 ${c.count} 次</div>
    </div>
  `).join('');

  graphGalleryScroll.querySelectorAll('.graph-gallery-card').forEach(card => {
    card.addEventListener('click', () => {
      graphContainer.classList.remove('show');
      collabSection.classList.add('show');
      graphToggleBtn.textContent = '🔗 关系图';
      graphToggleBtn.classList.remove('active');
      selectActor({
        id: parseInt(card.dataset.actorId),
        name: card.dataset.actorName,
        profile_path: card.dataset.actorProfile,
        known_for_department: ''
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

// ── fmtMoney ──────────────────────────────────
function fmtMoney(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(0) + 'M';
  return n.toString();
}

if (getApiKey()) showApp();
// Fallback: ensure show
setTimeout(function(){ if (document.getElementById("apiKeyPrompt").classList.contains("show")) showApp(); }, 50);

</script>
