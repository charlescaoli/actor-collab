<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actor Collab — 演员合作查询</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>Actor Collab</h1>
      <p>探索演员之间的合作关系</p>
    </header>

    <!-- API Key Prompt -->
    <div class="api-key-prompt show" id="apiKeyPrompt">
      <h2>需要 TMDB API Key</h2>
      <p>
        本应用使用 <a href="https://www.themoviedb.org/settings/api" target="_blank">TMDB API</a> 获取演员数据。
        请先注册免费账号并获取 API Key。
      </p>
      <div class="api-key-input">
        <input type="text" id="apiKeyInput" placeholder="粘贴你的 TMDB API Key...">
        <button class="btn" id="saveApiKey">保存</button>
      </div>
    </div>

    <!-- Search -->
    <div class="search-wrapper" id="searchWrapper" style="display:none">
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="输入演员名字... 例如：梁朝伟、Tom Hanks"
        autocomplete="off"
      >
      <div class="search-spinner" id="searchSpinner"></div>
    </div>

    <!-- Quick suggestions -->
    <div class="suggestions" id="suggestions" style="display:none">
      <button class="suggestion-chip" data-name="梁朝伟">梁朝伟</button>
      <button class="suggestion-chip" data-name="Tom Hanks">Tom Hanks</button>
      <button class="suggestion-chip" data-name="张国荣">张国荣</button>
      <button class="suggestion-chip" data-name="Scarlett Johansson">Scarlett Johansson</button>
      <button class="suggestion-chip" data-name="刘德华">刘德华</button>
      <button class="suggestion-chip" data-name="Brad Pitt">Brad Pitt</button>
    </div>

    <!-- Landing State -->
    <div id="landingState" style="text-align:center;padding:40px 20px;display:none">
      <p style="color:var(--text-secondary);font-size:1.05rem">搜索演员，发现他们的合作圈子</p>
    </div>

    <!-- Search Results Dropdown -->
    <div class="search-results" id="searchResults"></div>

    <!-- Selected Actor Banner -->
    <div class="actor-banner" id="actorBanner">
      <img class="avatar" id="bannerAvatar" src="" alt="">
      <div class="info">
        <h2 id="bannerName"></h2>
        <p class="bio" id="bannerDetails"></p>
        <div class="top-movies" id="bannerTopMovies"></div>
      </div>
      <button class="back-btn" id="backBtn">← 返回</button>
    </div>

    <!-- Loading -->
    <div class="loading-section" id="loadingSection">
      <p class="loading-text" id="loadingText">正在加载作品列表...</p>
      <div class="progress-bar">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Collaboration Results -->
    <div class="collab-section" id="collabSection">
      <h3 id="collabTitle"></h3>
      <div class="collab-grid" id="collabGrid"></div>
    </div>

    <!-- Error Toast -->
    <div class="error-toast" id="errorToast"></div>

    <!-- Movie Detail Modal -->
    <div class="modal-overlay" id="movieModal">
      <div class="modal-content">
        <button class="modal-close" id="modalClose">&times;</button>
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="modal-body">
          <div class="modal-poster-wrap">
            <img class="modal-poster" id="modalPoster" src="" alt="">
          </div>
          <div class="modal-info">
            <h2 id="modalTitle"></h2>
            <div class="modal-meta" id="modalMeta"></div>
            <p class="modal-overview" id="modalOverview"></p>
            <h3 style="margin-top:16px;font-size:1rem">演员表</h3>
            <div class="modal-cast" id="modalCast"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
