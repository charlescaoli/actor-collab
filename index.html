<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actor Collab</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <header class="header">
    <h1>Actor Collab</h1>
    <p>探索演员之间的合作关系</p>
  </header>

  <div class="api-key-prompt show" id="apiKeyPrompt">
    <h2>需要 TMDB API Key</h2>
    <p>本应用使用 <a href="https://www.themoviedb.org/settings/api" target="_blank">TMDB API</a></p>
    <div class="api-key-input">
      <input type="text" id="apiKeyInput" placeholder="粘贴你的 TMDB API Key...">
      <button class="btn" id="saveApiKey">保存</button>
    </div>
  </div>

  <div class="search-wrapper" id="searchWrapper" style="display:none">
    <input type="text" class="search-input" id="searchInput" placeholder="输入演员名字... 例如：梁朝伟、Tom Hanks" autocomplete="off">
    <div class="search-spinner" id="searchSpinner"></div>
  </div>

  <div class="suggestions" id="suggestions" style="display:none">
    <button class="suggestion-chip" data-name="梁朝伟">梁朝伟</button>
    <button class="suggestion-chip" data-name="Tom Hanks">Tom Hanks</button>
    <button class="suggestion-chip" data-name="张国荣">张国荣</button>
    <button class="suggestion-chip" data-name="Scarlett Johansson">Scarlett Johansson</button>
    <button class="suggestion-chip" data-name="刘德华">刘德华</button>
    <button class="suggestion-chip" data-name="Brad Pitt">Brad Pitt</button>
  </div>

  <div id="landingState" style="text-align:center;padding:40px 20px;display:none">
    <p>搜索演员，发现他们的合作圈子</p>
  </div>

  <div class="search-results" id="searchResults"></div>

  <div class="actor-banner" id="actorBanner">
    <img class="avatar" id="bannerAvatar" src="" alt="">
    <div class="info">
      <h2 id="bannerName"></h2>
      <p class="bio" id="bannerDetails"></p>
      <p class="actor-bio" id="bannerBio"></p>
      <div class="top-movies" id="bannerTopMovies"></div>
    </div>
    <div class="banner-actions">
      <button class="back-btn" id="backBtn">← 返回</button>
      <button class="graph-btn" id="graphToggleBtn">🔗 关系图</button>
    </div>
  </div>

  <div class="loading-section" id="loadingSection">
    <p class="loading-text" id="loadingText">正在加载作品列表...</p>
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
  </div>

  <div class="graph-container" id="graphContainer"></div>

  <div class="collab-section" id="collabSection">
    <h3 id="collabTitle"></h3>
    <div class="collab-grid" id="collabGrid"></div>
  </div>

  <div class="error-toast" id="errorToast"></div>

  <div class="modal-overlay" id="movieModal">
    <div class="modal-card">
      <div class="modal-hero" id="modalHero">
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body-wrap">
        <div class="modal-top">
          <img class="modal-poster-landscape" id="modalPoster" src="" alt="">
          <div class="modal-title-info">
            <h2 id="modalTitle"></h2>
            <p class="modal-orig-title" id="modalOrigTitle"></p>
            <div class="modal-meta-bar" id="modalMetaBar"></div>
          </div>
        </div>
        <div class="modal-stats-strip" id="modalStats"></div>
        <div class="modal-genre-row" id="modalGenres"></div>
        <div class="modal-section">
          <div class="modal-section-title">剧情简介</div>
          <p class="modal-overview-text" id="modalOverview"></p>
        </div>
        <div class="modal-section">
          <div class="modal-section-title" id="modalCastTitle">演员表</div>
          <div class="modal-cast-scroll" id="modalCast"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
