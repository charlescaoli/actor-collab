<!DOCTYPE html>
<html lang="zh-CN" style="color-scheme:dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<title>Actor Collab</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <header class="header">
    <h1>Actor Collab</h1>
    <p>探索演员之间的合作关系</p>
  </header>

  <div class="api-key-prompt show" id="apiKeyPrompt">
    <h2>需要 TMDB API Key</h2>
    <p>本应用使用 <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noreferrer">TMDB API</a> 查询演员和作品资料。</p>
    <p class="api-key-note">API Key 只保存在你当前浏览器的 localStorage 中，不会上传到任何服务器。保存前会先验证是否可用。</p>
    <div class="api-key-input">
      <label for="apiKeyInput" class="sr-only">TMDB API Key</label>
      <input type="text" id="apiKeyInput" placeholder="粘贴你的 TMDB API Key…" autocomplete="off">
      <button class="btn" id="saveApiKey">保存</button>
    </div>
    <p class="api-key-help">打开 TMDB API 页面，复制 API Key 后粘贴到这里。</p>
  </div>

  <div class="search-wrapper" id="searchWrapper" style="display:none">
    <label for="searchInput" class="sr-only">搜索演员</label>
    <input type="search" class="search-input" id="searchInput" placeholder="输入演员名字… 例如：梁朝伟、Tom Hanks" autocomplete="off">
    <div class="search-spinner" id="searchSpinner"></div>
  </div>

  <div class="suggestions" id="suggestions" style="display:none">
    <button class="suggestion-chip" data-name="梁朝伟">梁朝伟</button>
    <button class="suggestion-chip" data-name="Tom Hanks">Tom Hanks</button>
    <button class="suggestion-chip" data-name="张国荣">张国荣</button>
    <button class="suggestion-chip" data-name="Scarlett Johansson">Scarlett Johansson</button>
    <button class="suggestion-chip" data-name="刘德华">刘德华</button>
    <button class="suggestion-chip" data-name="Brad Pitt">Brad Pitt</button>
  </div>

  <div id="landingState" style="text-align:center;padding:40px 20px;display:none">
    <p>搜索演员，发现他们的合作圈子</p>
  </div>

  <div class="search-results" id="searchResults" role="listbox" aria-label="搜索结果"></div>

  <div class="actor-banner" id="actorBanner">
    <img class="avatar" id="bannerAvatar" src="" alt="" width="100" height="150">
    <div class="info">
      <h2 id="bannerName"></h2>
      <p class="bio" id="bannerDetails"></p>
      <p class="banner-aka" id="bannerAka" hidden></p>
      <div class="banner-stats" id="bannerStats"></div>
      <p class="actor-bio collapsed" id="bannerBio"></p>
      <button class="bio-toggle" id="bioToggle" hidden>展开全文 ▾</button>
      <div class="banner-gallery" id="bannerGallery" hidden></div>
      <div class="top-movies" id="bannerTopMovies"></div>
    </div>
    <div class="banner-actions">
      <button class="back-btn" id="backBtn">← 返回</button>
      <button class="graph-btn" id="graphToggleBtn">🔗 关系图</button>
    </div>
  </div>

  <div class="loading-section" id="loadingSection">
    <p class="loading-text" id="loadingText">正在加载作品列表…</p>
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
  </div>

  <div class="graph-actions" id="graphActions">
    <div class="graph-trail" id="graphTrail"></div>
    <button class="graph-small-btn" id="graphShuffleBtn">重排</button>
  </div>

  <div class="graph-container" id="graphContainer" aria-label="合作关系图，点击节点可查看共同作品"></div>

  <div class="graph-detail" id="graphDetail">
    <div>
      <div class="graph-detail-kicker">当前选中</div>
      <h3 id="graphDetailName"></h3>
      <p id="graphDetailMeta"></p>
      <div class="graph-shared-works" id="graphSharedWorks"></div>
    </div>
    <button class="graph-jump-btn" id="graphJumpBtn">跳到这位演员</button>
  </div>

  <div class="collab-section" id="collabSection">
    <h3 id="collabTitle"></h3>
    <div class="collab-grid" id="collabGrid"></div>
  </div>

  <div class="error-toast" id="errorToast" role="alert" aria-live="assertive"></div>

  <div class="modal-overlay" id="movieModal">
    <div class="modal-card">
      <div class="modal-hero" id="modalHero">
        <button class="modal-close" id="modalClose" aria-label="关闭">&times;</button>
      </div>
      <div class="modal-body-wrap">
        <div class="modal-top">
          <img class="modal-poster-landscape" id="modalPoster" src="" alt="">
          <div class="modal-title-info">
            <h2 id="modalTitle"></h2>
            <p class="modal-orig-title" id="modalOrigTitle"></p>
            <div class="modal-meta-bar" id="modalMetaBar"></div>
          </div>
        </div>
        <div class="modal-stats-strip" id="modalStats"></div>
        <div class="modal-genre-row" id="modalGenres"></div>
        <div class="modal-section">
          <div class="modal-section-title">剧情简介</div>
          <p class="modal-overview-text" id="modalOverview"></p>
        </div>
        <div class="modal-section">
          <div class="modal-section-title" id="modalCastTitle">演员表</div>
          <div class="modal-cast-scroll" id="modalCast"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="lightbox-overlay" id="photoLightbox">
    <button class="lightbox-close" id="lightboxClose" aria-label="关闭">&times;</button>
    <button class="lightbox-nav prev" id="lightboxPrev" aria-label="上一张">‹</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="">
    <button class="lightbox-nav next" id="lightboxNext" aria-label="下一张">›</button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
